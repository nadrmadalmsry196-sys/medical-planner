<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#071426">
  <meta name="description" content="مساحتك الطبية: منصة تعليمية متكاملة لطلاب الطب البشري من المستوى الأول حتى سنة الامتياز، تشمل المواد الطبية والمراجع والاختبارات وأدوات الذكاء الاصطناعي الطبي.">
  <title>مساحتك الطبية | Medical Study Hub</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <style>
    :root {
      --bg: #f4f7fb;
      --surface: #ffffff;
      --surface-2: #edf3f9;
      --text: #15243b;
      --muted: #718096;
      --primary: #087f8c;
      --primary-dark: #056570;
      --secondary: #4263eb;
      --accent: #11b8a6;
      --border: #e3eaf2;
      --shadow: 0 12px 35px rgba(24, 50, 84, .07);
      --radius: 20px;
      --sidebar-width: 260px;
    }

    body.dark {
      --bg: #08111f;
      --surface: #101d2e;
      --surface-2: #17263a;
      --text: #e9f0fb;
      --muted: #a0b0c6;
      --primary: #32c7c7;
      --primary-dark: #1ba5ac;
      --secondary: #8ca6ff;
      --accent: #39d6b2;
      --border: #26364b;
      --shadow: 0 12px 35px rgba(0, 0, 0, .16);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: 90px;
    }

    body {
      font-family: "Cairo", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.8;
      transition: background .25s, color .25s;
    }

    button, input, select {
      font: inherit;
    }

    button, a {
      -webkit-tap-highlight-color: transparent;
    }

    button {
      cursor: pointer;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    img {
      max-width: 100%;
      display: block;
    }

    .app {
      min-height: 100vh;
    }

    .sidebar {
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      width: var(--sidebar-width);
      background: var(--surface);
      border-left: 1px solid var(--border);
      padding: 25px 17px;
      overflow-y: auto;
      z-index: 1000;
      transition: transform .3s, background .25s;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 5px 8px 28px;
    }

    .brand-logo {
      width: 48px;
      height: 48px;
      border-radius: 15px;
      background: linear-gradient(135deg, #087f8c, #4263eb);
      display: grid;
      place-items: center;
      color: white;
      font-size: 23px;
      box-shadow: 0 8px 20px rgba(8, 127, 140, .22);
      flex-shrink: 0;
    }

    .brand h1 {
      font-size: 17px;
      font-weight: 900;
      line-height: 1.5;
    }

    .brand small {
      display: block;
      font-size: 10px;
      color: var(--muted);
      font-weight: 600;
    }

    .nav-label {
      font-size: 11px;
      font-weight: 800;
      color: var(--muted);
      padding: 15px 12px 9px;
    }

    .nav-link {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 13px;
      border-radius: 12px;
      margin-bottom: 4px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
      transition: .2s;
    }

    .nav-link i {
      width: 21px;
      text-align: center;
      font-size: 16px;
    }

    .nav-link:hover,
    .nav-link.active {
      background: var(--surface-2);
      color: var(--primary);
    }

    .sidebar-bottom {
      margin-top: 28px;
      padding: 15px;
      background: linear-gradient(145deg, rgba(8,127,140,.10), rgba(66,99,235,.08));
      border: 1px solid var(--border);
      border-radius: 16px;
    }

    .sidebar-bottom p {
      font-size: 12px;
      color: var(--muted);
      margin-top: 5px;
    }

    .main {
      margin-right: var(--sidebar-width);
      min-height: 100vh;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 900;
      min-height: 76px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 32px;
      gap: 16px;
    }

    .topbar-right,
    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .page-title {
      font-size: 18px;
      font-weight: 900;
    }

    .page-subtitle {
      color: var(--muted);
      font-size: 11px;
    }

    .icon-btn {
      width: 42px;
      height: 42px;
      border-radius: 13px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      display: grid;
      place-items: center;
      transition: .2s;
    }

    .icon-btn:hover {
      color: var(--primary);
      border-color: var(--primary);
    }

    .mobile-menu {
      display: none;
    }

    .content {
      max-width: 1500px;
      margin: auto;
      padding: 30px 32px 55px;
    }

    .hero {
      min-height: 335px;
      display: grid;
      grid-template-columns: 1.15fr .85fr;
      border-radius: 28px;
      overflow: hidden;
      background: linear-gradient(120deg, #071426 0%, #0a3450 55%, #087f8c 100%);
      color: white;
      position: relative;
      margin-bottom: 27px;
      box-shadow: 0 20px 45px rgba(7, 40, 67, .15);
    }

    .hero::before {
      content: "";
      position: absolute;
      width: 330px;
      height: 330px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,.13);
      top: -180px;
      right: -60px;
      box-shadow: 0 0 0 35px rgba(255,255,255,.025),
                  0 0 0 75px rgba(255,255,255,.02);
    }

    .hero-text {
      position: relative;
      z-index: 2;
      padding: 38px 38px 35px;
      align-self: center;
    }

    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(255,255,255,.12);
      border: 1px solid rgba(255,255,255,.18);
      border-radius: 30px;
      padding: 6px 13px;
      font-size: 11px;
      margin-bottom: 18px;
    }

    .hero h2 {
      font-size: clamp(25px, 3vw, 39px);
      font-weight: 900;
      line-height: 1.55;
      margin-bottom: 12px;
    }

    .hero h2 span {
      color: #61e1d1;
    }

    .hero p {
      max-width: 560px;
      color: #d1e4f0;
      font-size: 13px;
      margin-bottom: 23px;
    }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .btn {
      border: none;
      border-radius: 12px;
      padding: 11px 18px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      font-size: 12px;
      font-weight: 800;
      transition: transform .2s, opacity .2s;
    }

    .btn:hover {
      transform: translateY(-2px);
    }

    .btn-primary {
      background: #55dfcc;
      color: #073345;
    }

    .btn-white {
      background: rgba(255,255,255,.12);
      border: 1px solid rgba(255,255,255,.25);
      color: white;
    }

    .hero-image {
      min-height: 300px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 22px;
    }

    .hero-image img {
      width: 100%;
      height: 300px;
      object-fit: cover;
      border-radius: 22px;
      opacity: .86;
      mask-image: linear-gradient(to left, black 55%, transparent 100%);
    }

    .hero-image::after {
      content: "";
      position: absolute;
      inset: 22px;
      border-radius: 22px;
      background: linear-gradient(90deg, #0a3450 0%, transparent 85%);
      pointer-events: none;
    }

    .section {
      margin-top: 35px;
      scroll-margin-top: 100px;
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin-bottom: 19px;
    }

    .section-heading {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .section-icon {
      width: 46px;
      height: 46px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      background: rgba(8,127,140,.10);
      color: var(--primary);
      font-size: 19px;
      flex-shrink: 0;
    }

    .section-header h2 {
      font-size: 19px;
      font-weight: 900;
      line-height: 1.5;
    }

    .section-header p {
      color: var(--muted);
      font-size: 11px;
    }

    .text-link {
      color: var(--primary);
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 16px;
    }

    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 21px;
      box-shadow: var(--shadow);
      transition: transform .2s;
    }

    .stat-card:hover {
      transform: translateY(-4px);
    }

    .stat-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .stat-icon {
      width: 43px;
      height: 43px;
      border-radius: 13px;
      display: grid;
      place-items: center;
      font-size: 19px;
    }

    .stat-number {
      font-size: 27px;
      font-weight: 900;
      line-height: 1.4;
    }

    .stat-label {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .c-teal { background: rgba(17,184,166,.13); color: #0ca99b; }
    .c-blue { background: rgba(66,99,235,.12); color: #5272ec; }
    .c-purple { background: rgba(142,68,173,.12); color: #9b59b6; }
    .c-orange { background: rgba(243,156,18,.13); color: #e59819; }

    .search-box {
      position: relative;
      max-width: 400px;
      width: 100%;
    }

    .search-box input {
      width: 100%;
      padding: 12px 43px 12px 14px;
      border: 1px solid var(--border);
      border-radius: 13px;
      background: var(--surface);
      color: var(--text);
      outline: none;
      font-size: 12px;
    }

    .search-box input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(8,127,140,.08);
    }

    .search-box i {
      position: absolute;
      right: 15px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
    }

    .filter-row {
      display: flex;
      gap: 9px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    .filter-btn {
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--muted);
      border-radius: 10px;
      padding: 8px 15px;
      font-size: 11px;
      font-weight: 800;
      transition: .2s;
    }

    .filter-btn.active,
    .filter-btn:hover {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    .levels-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 17px;
    }

    .level-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 22px;
      box-shadow: var(--shadow);
      transition: transform .2s, border-color .2s;
      display: flex;
      flex-direction: column;
    }

    .level-card:hover {
      transform: translateY(-4px);
      border-color: var(--primary);
    }

    .level-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 15px;
    }

    .level-number {
      width: 52px;
      height: 52px;
      border-radius: 16px;
      display: grid;
      place-items: center;
      color: white;
      font-size: 21px;
      font-weight: 900;
      background: linear-gradient(135deg, #087f8c, #4263eb);
    }

    .level-tag {
      background: var(--surface-2);
      color: var(--primary);
      padding: 5px 9px;
      border-radius: 8px;
      font-size: 10px;
      font-weight: 800;
    }

    .level-card h3 {
      font-size: 16px;
      font-weight: 900;
      margin-bottom: 5px;
    }

    .level-card > p {
      color: var(--muted);
      font-size: 11px;
      margin-bottom: 16px;
    }

    .subject-preview {
      list-style: none;
      margin-bottom: 19px;
      flex-grow: 1;
    }

    .subject-preview li {
      font-size: 11px;
      padding: 7px 0;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .subject-preview li i {
      color: var(--primary);
      font-size: 11px;
    }

    .level-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      border-top: 1px solid var(--border);
      padding-top: 15px;
    }

    .level-footer span {
      color: var(--muted);
      font-size: 10px;
    }

    .small-btn {
      border: none;
      background: var(--surface-2);
      color: var(--primary);
      border-radius: 9px;
      padding: 9px 12px;
      font-size: 11px;
      font-weight: 900;
    }

    .small-btn:hover {
      background: var(--primary);
      color: white;
    }

    .ai-hero {
      background: linear-gradient(125deg, #10253f, #173e62 60%, #087f8c);
      border-radius: 25px;
      padding: 30px;
      color: white;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 22px;
      overflow: hidden;
      position: relative;
    }

    .ai-hero::before {
      content: "\f544";
      font-family: "Font Awesome 6 Free";
      font-weight: 900;
      position: absolute;
      font-size: 180px;
      left: 15px;
      top: -35px;
      opacity: .055;
    }

    .ai-hero-content {
      position: relative;
      z-index: 1;
      max-width: 720px;
    }

    .ai-hero h3 {
      font-size: 24px;
      font-weight: 900;
      margin-bottom: 9px;
    }

    .ai-hero p {
      color: #d4e6f2;
      font-size: 12px;
      margin-bottom: 18px;
    }

    .ai-hero .ai-label {
      display: inline-block;
      font-size: 10px;
      padding: 5px 11px;
      border-radius: 20px;
      background: rgba(80,225,204,.15);
      color: #75f2df;
      margin-bottom: 12px;
    }

    .ai-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 17px;
    }

    .ai-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 22px;
      display: flex;
      flex-direction: column;
      box-shadow: var(--shadow);
      transition: transform .2s, border-color .2s;
    }

    .ai-card:hover {
      transform: translateY(-4px);
      border-color: var(--primary);
    }

    .ai-card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 15px;
    }

    .ai-logo {
      width: 49px;
      height: 49px;
      border-radius: 15px;
      display: grid;
      place-items: center;
      font-size: 21px;
      color: white;
      background: linear-gradient(135deg, #087f8c, #4263eb);
    }

    .ai-type {
      font-size: 10px;
      font-weight: 800;
      background: var(--surface-2);
      color: var(--primary);
      border-radius: 8px;
      padding: 5px 9px;
    }

    .ai-card h3 {
      font-size: 15px;
      font-weight: 900;
      margin-bottom: 8px;
    }

    .ai-card p {
      color: var(--muted);
      font-size: 11px;
      margin-bottom: 15px;
      flex-grow: 1;
    }

    .ai-features {
      list-style: none;
      margin-bottom: 19px;
    }

    .ai-features li {
      font-size: 11px;
      padding: 5px 0;
      display: flex;
      align-items: flex-start;
      gap: 8px;
    }

    .ai-features i {
      color: var(--primary);
      margin-top: 6px;
    }

    .ai-card .btn {
      width: 100%;
      background: var(--surface-2);
      color: var(--primary);
      border: 1px solid var(--border);
    }

    .ai-card .btn:hover {
      background: var(--primary);
      color: white;
    }

    .medical-warning {
      margin-top: 20px;
      padding: 17px 19px;
      border: 1px solid rgba(243,156,18,.35);
      border-radius: 15px;
      background: rgba(243,156,18,.07);
      display: flex;
      gap: 12px;
      align-items: flex-start;
    }

    .medical-warning i {
      color: #e59819;
      font-size: 20px;
      margin-top: 3px;
    }

    .medical-warning h4 {
      font-size: 12px;
      margin-bottom: 4px;
    }

    .medical-warning p {
      color: var(--muted);
      font-size: 11px;
    }

    .study-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }

    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 22px;
      box-shadow: var(--shadow);
    }

    .panel h3 {
      font-size: 15px;
      font-weight: 900;
      margin-bottom: 6px;
    }

    .panel-subtitle {
      color: var(--muted);
      font-size: 11px;
      margin-bottom: 18px;
    }

    .subject-list {
      display: grid;
      gap: 10px;
    }

    .subject-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
      background: var(--surface-2);
      border-radius: 12px;
    }

    .subject-item > i {
      color: var(--primary);
      font-size: 17px;
      width: 23px;
      text-align: center;
    }

    .subject-item div {
      flex: 1;
    }

    .subject-item strong {
      font-size: 12px;
      display: block;
    }

    .subject-item small {
      color: var(--muted);
      font-size: 10px;
    }

    .progress-bar {
      height: 7px;
      background: var(--border);
      border-radius: 10px;
      overflow: hidden;
      margin-top: 7px;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--primary), var(--accent));
      border-radius: inherit;
      transition: width .4s;
    }

    .timer-display {
      font-size: 48px;
      text-align: center;
      font-weight: 900;
      letter-spacing: 3px;
      margin: 20px 0;
      font-variant-numeric: tabular-nums;
    }

    .timer-controls {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .timer-controls .btn-primary {
      background: var(--primary);
      color: white;
    }

    .timer-info {
      color: var(--muted);
      font-size: 11px;
      text-align: center;
      margin-top: 17px;
    }

    .resources-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 15px;
    }

    .resource-card {
      padding: 20px;
      border-radius: 17px;
      background: var(--surface);
      border: 1px solid var(--border);
      transition: .2s;
    }

    .resource-card:hover {
      border-color: var(--primary);
      transform: translateY(-3px);
    }

    .resource-card i {
      font-size: 24px;
      color: var(--primary);
      margin-bottom: 13px;
    }

    .resource-card h3 {
      font-size: 13px;
      margin-bottom: 6px;
    }

    .resource-card p {
      font-size: 10px;
      color: var(--muted);
      margin-bottom: 13px;
    }

    .resource-card a {
      font-size: 11px;
      color: var(--primary);
      font-weight: 900;
    }

    .quiz-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      box-shadow: var(--shadow);
    }

    .quiz-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }

    .quiz-meta span {
      color: var(--muted);
      font-size: 11px;
