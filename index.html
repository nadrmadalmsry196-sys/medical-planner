<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#071426">
  <title>مساحتك الطبية | Medical Study Hub</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <style>
    :root {
      --bg: #f4f7fb;
      --surface: #ffffff;
      --surface-2: #edf3f9;
      --text: #15243b;
      --muted: #718096;
      --primary: #087f8c;
      --primary-dark: #056570;
      --secondary: #4263eb;
      --accent: #11b8a6;
      --border: #e3eaf2;
      --shadow: 0 12px 35px rgba(24, 50, 84, .07);
      --radius: 20px;
      --sidebar-width: 260px;
    }

    body.dark {
      --bg: #08111f;
      --surface: #101d2e;
      --surface-2: #17263a;
      --text: #e9f0fb;
      --muted: #a0b0c6;
      --primary: #32c7c7;
      --primary-dark: #1ba5ac;
      --secondary: #8ca6ff;
      --accent: #39d6b2;
      --border: #26364b;
      --shadow: 0 12px 35px rgba(0, 0, 0, .16);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body { font-family: "Cairo", sans-serif; background: var(--bg); color: var(--text); line-height: 1.8; transition: background .25s, color .25s; }

    button, input, select { font: inherit; }
    button { cursor: pointer; border: none; background: none; }
    a { color: inherit; text-decoration: none; }

    .sidebar {
      position: fixed; top: 0; right: 0; bottom: 0;
      width: var(--sidebar-width);
      background: var(--surface);
      border-left: 1px solid var(--border);
      padding: 25px 17px;
      overflow-y: auto;
      z-index: 1000;
      transition: background .25s;
    }

    .brand {
      display: flex; align-items: center; gap: 12px;
      padding: 5px 8px 28px;
    }

    .brand-logo {
      width: 48px; height: 48px; border-radius: 15px;
      background: linear-gradient(135deg, #087f8c, #4263eb);
      display: grid; place-items: center; color: white;
      font-size: 23px; box-shadow: 0 8px 20px rgba(8, 127, 140, .22);
      flex-shrink: 0;
    }

    .brand h1 { font-size: 16px; font-weight: 900; line-height: 1.4; }
    .brand small { display: block; font-size: 10px; color: var(--muted); font-weight: 600; }

    .nav-label { font-size: 11px; font-weight: 800; color: var(--muted); padding: 15px 12px 9px; }
    .nav-link {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 13px; border-radius: 12px; margin-bottom: 4px;
      color: var(--muted); font-size: 13px; font-weight: 700; transition: .2s;
    }
    .nav-link i { width: 21px; text-align: center; font-size: 16px; }
    .nav-link:hover, .nav-link.active { background: var(--surface-2); color: var(--primary); }

    .main {
      margin-right: var(--sidebar-width);
      min-height: 100vh;
      padding: 30px;
    }

    .topbar {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 15px 25px;
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 25px; box-shadow: var(--shadow);
    }

    .page-title h2 { font-size: 18px; font-weight: 900; }
    .page-title p { color: var(--muted); font-size: 11px; }

    .icon-btn {
      width: 42px; height: 42px; border-radius: 13px;
      border: 1px solid var(--border); background: var(--surface-2);
      color: var(--text); display: grid; place-items: center; transition: .2s;
    }
    .icon-btn:hover { color: var(--primary); border-color: var(--primary); }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 25px; box-shadow: var(--shadow);
      margin-bottom: 25px;
    }

    .card h3 {
      font-size: 17px; font-weight: 900; color: var(--primary);
      margin-bottom: 18px; display: flex; align-items: center; gap: 10px;
      border-bottom: 2px solid var(--surface-2); padding-bottom: 10px;
    }

    .form-group { margin-bottom: 16px; }
    label { display: block; font-weight: 700; font-size: 13px; margin-bottom: 6px; }
    input, select, textarea {
      width: 100%; padding: 12px; border: 1px solid var(--border);
      border-radius: 12px; background: var(--surface-2); color: var(--text);
      outline: none; font-family: "Cairo", sans-serif;
    }
    input:focus, select:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(8,127,140,.08); }

    .btn {
      background: var(--primary); color: white; border: none;
      padding: 12px 20px; border-radius: 12px; font-family: "Cairo", sans-serif;
      font-weight: 800; font-size: 13px; cursor: pointer; width: 100%; transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.9; }

    .result-box {
      margin-top: 15px; padding: 16px; background: var(--surface-2);
      border-radius: 12px; border-right: 4px solid var(--primary); font-size: 13px; line-height: 1.7;
    }

    @media (max-width: 900px) {
      .sidebar { width: 70px; padding: 15px 10px; }
      .sidebar .brand h1, .sidebar .brand small, .sidebar .nav-label, .sidebar .nav-link span { display: none; }
      .main { margin-right: 70px; padding: 15px; }
    }
  </style>
</head>
<body>

  <!-- القائمة الجانبية -->
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-logo"><i class="fa-solid fa-stethoscope"></i></div>
      <div>
        <h1>مساحتك الطبية</h1>
        <small>Medical Hub</small>
      </div>
    </div>
    <div class="nav-label">القائمة الرئيسية</div>
    <a href="#planner" class="nav-link active"><i class="fa-solid fa-calendar-days"></i><span>تخطيط الوقت</span></a>
    <a href="#ai" class="nav-link"><i class="fa-solid fa-robot"></i><span>المساعد الذكي</span></a>
  </aside>

  <!-- المحتوى الرئيسي -->
  <main class="main">
    <div class="topbar">
      <div class="page-title">
        <h2>لوحة التحكم الطبية</h2>
        <p>مرحباً بك مجدداً يا دكتور المستقبل</p>
      </div>
      <div class="topbar-actions">
        <button class="icon-btn" onclick="toggleTheme()" title="تبديل الوضع الليلي"><i class="fa-solid fa-moon" id="themeIcon"></i></button>
      </div>
    </div>

    <!-- 1. قسم تخطيط الوقت -->
    <section id="planner" class="card">
      <h3><i class="fa-solid fa-calendar-days"></i> جدول تنظيم الوقت والمحاضرات</h3>
      <div class="form-group">
        <label>اسم المادة الطبية:</label>
        <input type="text" id="subjectName" placeholder="مثال: علم الأدوية - Pharmacology">
      </div>
      <div class="form-group">
        <label>عدد المحاضرات الكلي:</label>
        <input type="number" id="totalLecs" value="20" min="1">
      </div>
      <div class="form-group">
        <label>متوسط مدة المحاضرة (بالدقائق):</label>
        <input type="number" id="lecMins" value="45" min="10">
      </div>
      <button class="btn" onclick="calculatePlan()">توليد جدول الخطة الدراسية</button>
      <div class="result-box" id="planResult" style="display: none;"></div>
    </section>

    <!-- 2. قسم المساعد الذكي -->
    <section id="ai" class="card">
      <h3><i class="fa-solid fa-robot"></i> المساعد الطبي الذكي (عربي / English)</h3>
      <div class="form-group">
        <label>اسأل عن أي مصطلح أو آلية مرضية:</label>
        <input type="text" id="aiQuery" placeholder="مثال: Molecular / Insulin">
      </div>
      <button class="btn" style="background: var(--secondary);" onclick="askAI()">طلب تبسيط وشرح منظم (AI)</button>
      <div class="result-box" id="aiBox" style="display: none;"></div>
    </section>
  </main>

  <script>
    function toggleTheme() {
      document.body.classList.toggle('dark');
      const isDark = document.body.classList.contains('dark');
      document.getElementById('themeIcon').className = isDark ? "fa-solid fa-sun" : "fa-solid fa-moon";
    }

    function calculatePlan() {
      const name = document.getElementById('subjectName').value || 'المادة الطبية';
      const total = parseInt(document.getElementById('totalLecs').value);
      const mins = parseInt(document.getElementById('lecMins').value);
      const totalHours = ((total * mins) / 60).toFixed(1);
      const perDay = Math.ceil(total / 14);

      const res = document.getElementById('planResult');
      res.style.display = 'block';
      res.innerHTML = `<b>📊 خطة مادة: ${name}</b><br>` +
                      `• إجمالي وقت المحاضرات: ${totalHours} ساعة.<br>` +
                      `• المقترح لإنجازها بكفاءة: ${perDay} محاضرات يومياً.`;
    }

    function askAI() {
      const rawQuery = document.getElementById('aiQuery').value.trim();
      const box = document.getElementById('aiBox');
      box.style.display = 'block';

      if(!rawQuery) {
        box.innerHTML = "يرجى كتابة المصطلح أو السؤال الطبي أولاً.";
        return;
      }

      let arDef = `المفهوم السريري والتعريف لـ (${rawQuery}): دراسة الخصائص والهدف الوظيفي بدقة عالية.`;
      let arMech = `الآلية والمسار الحيوي: تفاعل الخلايا والأعضاء لإنتاج الاستجابة العضوية المرتبطة بـ (${rawQuery}).`;
      let enDef = `Clinical definition of (${rawQuery}): Comprehensive analysis of functional properties.`;
      let enMech = `Pathophysiological mechanism: Step-by-step biological response associated with (${rawQuery}).`;

      const q = rawQuery.toLowerCase();
      if(q.includes('molecular') || q.includes('moleculer') || q.includes('جزيئي')) {
        arDef = "المستوى الجزيئي (Molecular Level): يدرس العمليات الحيوية والتشكيل البنيوي للجزيئات كـ DNA والبروتينات داخل الخلية.";
        arMech = "الآلية: تفاعل جزيئي دقيق يتم عبر نسخ الترجمة وبناء السلسلة البروتينية لتحديد وظيفة الخلية.";
        enDef = "Molecular Level: Studies biological processes and structures of biomolecules like DNA and proteins within cells.";
        enMech = "Mechanism: Precise molecular interactions via gene transcription and protein synthesis.";
      }

      box.innerHTML = `<b>🤖 إجابة المساعد الذكي حول (${rawQuery}):</b><br><br>` +
                      `🔹 <b>الشرح والتعريف بالعربية:</b><br>` +
                      `1. <u>التعريف والصفات:</u> ${arDef}<br>` +
                      `2. <u>الآلية والمسار:</u> ${arMech}<br><br>` +
                      `🔹 <b>English Retention Notes:</b><br>` +
                      `1. <u>Definition & Properties:</u> ${enDef}<br>` +
                      `2. <u>Mechanism:</u> ${enMech}`;
    }
  </script>
</body>
</html>
