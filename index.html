<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أداة تخطيط المذاكرة الطبية - Medical Study Planner</title>
    <style>
        body { font-family: Tahoma, sans-serif; background: #f4f6f9; color: #333; padding: 20px; direction: rtl; }
        .container { max-width: 600px; margin: auto; background: #fff; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h1 { color: #0077b6; text-align: center; font-size: 22px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        button { background: #0077b6; color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; width: 100%; font-size: 16px; }
        button:hover { background: #023e8a; }
        .result { margin-top: 20px; padding: 15px; background: #e0fbfc; border-radius: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>أداة تخطيط المذاكرة الطبية<br><span style="font-size: 14px; color: #555;">Medical Study & Credit Planner</span></h1>
        
        <div class="form-group">
            <label>اسم المادة الطبية / Medical Subject:</label>
            <input type="text" id="subjectName" placeholder="مثال: علم الفسيولوجي - Physiology">
        </div>

        <div class="form-group">
            <label>عدد الساعات المعتمدة / Credit Hours:</label>
            <input type="number" id="creditHours" value="3" min="1" max="10">
        </div>

        <div class="form-group">
            <label>عدد المحاضرات الكلي / Total Lectures:</label>
            <input type="number" id="totalLectures" value="20" min="1">
        </div>

        <div class="form-group">
            <label>المحاضرات المنجزة / Completed Lectures:</label>
            <input type="number" id="completedLectures" value="0" min="0">
        </div>

        <button onclick="calculateProgress()">حساب الخطة والإنجاز / Calculate</button>

        <div class="result" id="resultArea" style="display: none;">
            <h3>النتيجة / Result:</h3>
            <p id="progressText"></p>
        </div>
    </div>

    <script>
        function calculateProgress() {
            const name = document.getElementById('subjectName').value || 'المادة';
            const hours = document.getElementById('creditHours').value;
            const total = parseInt(document.getElementById('totalLectures').value);
            const completed = parseInt(document.getElementById('completedLectures').value);
            
            if(total <= 0) return;
            const percentage = Math.round((completed / total) * 100);
            
            const resArea = document.getElementById('resultArea');
            const resText = document.getElementById('progressText');
            
            resArea.style.display = 'block';
            resText.innerHTML = `مادة: <b>${name}</b> (الساعات: ${hours})<br>نسبة الإنجاز: <b>${percentage}%</b> (${completed} من ${total} محاضرة).`;
        }
    </script>
</body>
</html>
